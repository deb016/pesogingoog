[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # VITE_* variables are intentionally inlined into the client bundle by Vite.
  # The Google Maps key is a browser key (restrict it by HTTP referrer in Google Cloud),
  # and VITE_API_BASE is a public URL, so neither should fail secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_MAPS_API_KEY,VITE_API_BASE"
